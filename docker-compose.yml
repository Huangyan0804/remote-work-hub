# 本地开发数据库：一条命令启动 PostgreSQL
# 用法：docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: remote-work-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: remote_work_hub
    ports:
      # 宿主机端口:容器内端口（PostgreSQL 默认 5432）
      - "5432:5432"
    volumes:
      # 数据持久化到 Docker 卷，容器删除后数据不丢
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
